apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuple-listener
  namespace: system
  labels:
    app.kubernetes.io/name: bridder
    app.kubernetes.io/component: tuple-listener
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bridder
      app.kubernetes.io/component: tuple-listener
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bridder
        app.kubernetes.io/component: tuple-listener
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /tuple-listener
        env:
        - name: OPENFGA_API_URL
          valueFrom:
            secretKeyRef:
              name: bridder-config
              key: OPENFGA_API_URL
        - name: OPENFGA_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: bridder-config
              key: OPENFGA_API_TOKEN
              optional: true
        - name: TUPLE_LISTENER_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TUPLE_LISTENER_RELEASE_NAME
          value: bridder-authorization-model
        - name: NATS_URL
          valueFrom:
            secretKeyRef:
              name: bridder-config
              key: NATS_URL
        - name: NATS_TOKEN
          valueFrom:
            secretKeyRef:
              name: bridder-config
              key: NATS_TOKEN
              optional: true
        - name: NATS_STREAM
          valueFrom:
            secretKeyRef:
              name: bridder-config
              key: NATS_STREAM
              optional: true
        - name: NATS_SUBJECT
          valueFrom:
            secretKeyRef:
              name: bridder-config
              key: NATS_SUBJECT
              optional: true
        - name: NATS_CONSUMER
          valueFrom:
            secretKeyRef:
              name: bridder-config
              key: NATS_CONSUMER
              optional: true
        - name: NATS_DLQ_SUBJECT
          valueFrom:
            secretKeyRef:
              name: bridder-config
              key: NATS_DLQ_SUBJECT
              optional: true
        - name: TUPLE_LISTENER_BATCH_SIZE
          valueFrom:
            secretKeyRef:
              name: bridder-config
              key: TUPLE_LISTENER_BATCH_SIZE
              optional: true
        image: controller:latest
        imagePullPolicy: IfNotPresent
        name: tuple-listener
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
