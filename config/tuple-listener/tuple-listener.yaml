apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuple-listener
  namespace: system
  labels:
    app.kubernetes.io/name: bridder
    app.kubernetes.io/component: tuple-listener
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bridder
      app.kubernetes.io/component: tuple-listener
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bridder
        app.kubernetes.io/component: tuple-listener
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /tuple-listener
        env:
        - name: OPENFGA_API_URL
          value: http://bridder-openfga:8080
        - name: TUPLE_LISTENER_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TUPLE_LISTENER_RELEASE_NAME
          value: bridder-authorization-model
        - name: NATS_URL
          value: nats://bridder-nats:4222
        - name: NATS_STREAM
          value: bridder-tuples
        - name: NATS_SUBJECT
          value: bridder.tuples.ops
        - name: NATS_CONSUMER
          value: bridder-tuple-listener
        - name: NATS_DLQ_SUBJECT
          value: bridder.tuples.ops.dlq
        - name: TUPLE_LISTENER_BATCH_SIZE
          value: "50"
        image: controller:latest
        imagePullPolicy: IfNotPresent
        name: tuple-listener
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
