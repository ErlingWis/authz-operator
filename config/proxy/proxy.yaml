apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorization-model-proxy
  labels:
    app.kubernetes.io/name: bridder
    app.kubernetes.io/component: authorization-model-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bridder
      app.kubernetes.io/component: authorization-model-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bridder
        app.kubernetes.io/component: authorization-model-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /authz-proxy
        env:
        - name: OPENFGA_API_URL
          valueFrom:
            secretKeyRef:
              name: bridder-config
              key: OPENFGA_API_URL
        - name: OPENFGA_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: bridder-config
              key: OPENFGA_API_TOKEN
              optional: true
        - name: AUTHZ_PROXY_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: AUTHZ_PROXY_RELEASE_NAME
          value: bridder-authorization-model
        image: controller:latest
        imagePullPolicy: IfNotPresent
        name: authz-proxy
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /.well-known/authzen-configuration
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /.well-known/authzen-configuration
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      serviceAccountName: controller-manager
---
apiVersion: v1
kind: Service
metadata:
  name: authorization-model-proxy
  labels:
    app.kubernetes.io/name: bridder
    app.kubernetes.io/component: authorization-model-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bridder
    app.kubernetes.io/component: authorization-model-proxy
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
