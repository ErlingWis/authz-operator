apiVersion: v1
kind: ConfigMap
metadata:
  name: authorization-model-proxy-config
  labels:
    app.kubernetes.io/name: bridder
    app.kubernetes.io/component: authorization-model-proxy
    app.kubernetes.io/managed-by: kustomize
data:
  nginx.conf: |
    events {}

    http {
        server {
            listen 8080;

            location = /.well-known/authzen-configuration {
                default_type application/json;
                return 200 '{"access_evaluation_endpoint":"/access/v1/evaluation","access_evaluations_endpoint":"/access/v1/evaluations","search_resource_endpoint":"/access/v1/search/resource","search_subject_endpoint":"/access/v1/search/subject","search_action_endpoint":"/access/v1/search/action"}';
            }

            location = /access/v1/evaluation {
                return 503;
            }

            location = /access/v1/evaluations {
                return 503;
            }

            location = /access/v1/search/resource {
                return 503;
            }

            location = /access/v1/search/subject {
                return 503;
            }

            location = /access/v1/search/action {
                return 503;
            }

            location / {
                return 404;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorization-model-proxy
  labels:
    app.kubernetes.io/name: bridder
    app.kubernetes.io/component: authorization-model-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bridder
      app.kubernetes.io/component: authorization-model-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bridder
        app.kubernetes.io/component: authorization-model-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: nginx-tmp
          mountPath: /tmp
      volumes:
      - name: nginx-config
        configMap:
          name: authorization-model-proxy-config
          items:
          - key: nginx.conf
            path: nginx.conf
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: authorization-model-proxy
  labels:
    app.kubernetes.io/name: bridder
    app.kubernetes.io/component: authorization-model-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bridder
    app.kubernetes.io/component: authorization-model-proxy
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
