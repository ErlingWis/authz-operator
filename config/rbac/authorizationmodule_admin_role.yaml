# This rule is not used by the project authz-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over authz.erli.ng.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: authz-operator
    app.kubernetes.io/managed-by: kustomize
  name: authorizationmodule-admin-role
rules:
  - apiGroups:
      - authz.erli.ng
    resources:
      - authorizationmodules
    verbs:
      - "*"
  - apiGroups:
      - authz.erli.ng
    resources:
      - authorizationmodules/status
    verbs:
      - get
