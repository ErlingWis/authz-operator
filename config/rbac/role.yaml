---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - authz.erli.ng
  resources:
  - authorizationmodules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - authz.erli.ng
  resources:
  - authorizationmodules/finalizers
  verbs:
  - update
- apiGroups:
  - authz.erli.ng
  resources:
  - authorizationmodules/status
  verbs:
  - get
  - patch
  - update
